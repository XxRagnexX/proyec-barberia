# Nombre y puerto de la aplicacion -> http://localhost:8080
spring.application.name=api_barberia
server.port=8080

# Conexion a la base de datos H2 (en memoria: los datos se borran al apagar la app)
spring.datasource.url=jdbc:h2:mem:barberia_db
spring.datasource.username=sa
spring.datasource.password=

# Consola web para ver las tablas -> http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Hibernate crea las tablas solo a partir de las clases del paquete model
spring.jpa.hibernate.ddl-auto=create-drop
# Muestra en la consola el SQL que se ejecuta
spring.jpa.show-sql=true

# Carga los datos de ejemplo de data.sql despues de crear las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.encoding=UTF-8
