# Microservicio de Citas -> http://localhost:8082
spring.application.name=ms-citas
server.port=8082

# Base de datos H2 propia del microservicio (guardada en archivo: los datos persisten)
spring.datasource.url=jdbc:h2:file:./data/citas;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Consola web para ver las tablas -> http://localhost:8082/h2-console
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
