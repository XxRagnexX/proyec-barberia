# Microservicio de Usuarios / Barberos -> http://localhost:8081
spring.application.name=ms-usuarios
server.port=8081

# Base de datos H2 propia del microservicio (guardada en archivo: los datos persisten)
spring.datasource.url=jdbc:h2:file:./data/usuarios;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Consola web para ver las tablas -> http://localhost:8081/h2-console
spring.h2.console.enabled=true

# Hibernate crea/actualiza las tablas a partir de las clases del paquete entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
