# Microservicio de Resenas -> http://localhost:8085
spring.application.name=ms-resenas
server.port=8085

# Base de datos H2 propia del microservicio (guardada en archivo: los datos persisten)
spring.datasource.url=jdbc:h2:file:./data/resenas;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Consola web para ver las tablas -> http://localhost:8085/h2-console
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true